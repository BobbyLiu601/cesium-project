name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Tianditu token
        env:
          TIANDITU_TOKEN: ${{ secrets.TIANDITU_TOKEN }}
        run: |
          if [ -z "$TIANDITU_TOKEN" ]; then
            echo "::warning::TIANDITU_TOKEN is not configured; deploying without Tianditu layers."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        env:
          VITE_TIANDITU_TOKEN: ${{ secrets.TIANDITU_TOKEN }}
        run: pnpm verify

      - name: Verify Pages artifact
        env:
          VITE_TIANDITU_TOKEN: ${{ secrets.TIANDITU_TOKEN }}
        run: pnpm verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
